<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kid News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #1b1740;
    --sub: #5b5878;
    --accent: #7c3aed;
    --sun: #ffd60a;
    --mint: #c7f9cc;
    --topic: #475569;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 500;
    background-color: var(--bg);
    background-image: radial-gradient(rgba(27, 23, 64, 0.08) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
  }
  .display { font-family: "Fredoka", "Nunito", sans-serif; font-weight: 700; }

  header {
    padding: 30px 20px 10px;
    text-align: center;
  }
  header h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    margin: 0;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    letter-spacing: 0.01em;
    line-height: 1;
    display: inline-block;
    transform: rotate(-2deg);
    text-shadow: 4px 4px 0 var(--sun);
  }
  header h1 span { color: var(--accent); }
  header p {
    margin: 14px 0 0;
    color: var(--sub);
    font-size: 1.05rem;
    font-weight: 700;
  }
  .streak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 800;
  }

  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 18px 0 10px;
    padding: 0 16px;
  }
  .chip {
    font-family: inherit;
    font-weight: 800;
    border: 3px solid var(--ink);
    background: #fff;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .chip:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
  .chip:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .chip.active { background: var(--ink); color: #fff; }
  .chip.surprise { background: var(--sun); }
  .status {
    text-align: center;
    color: var(--sub);
    font-size: 0.8rem;
    font-weight: 700;
    min-height: 20px;
    margin-bottom: 10px;
    padding: 0 16px;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 8px 16px 60px;
    display: grid;
    gap: 22px;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  }
  .card {
    position: relative;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 22px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    box-shadow: 7px 7px 0 var(--topic);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translate(-3px, -3px) rotate(-0.4deg); box-shadow: 11px 11px 0 var(--topic); }
  .card:active { transform: translate(2px, 2px); box-shadow: 3px 3px 0 var(--topic); }
  .card:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  .card.read { opacity: 0.72; }
  .card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    background: var(--mint);
    border-bottom: 3px solid var(--ink);
  }
  .card.hero { grid-column: 1 / -1; }
  .card.hero img { height: clamp(220px, 40vw, 360px); }
  .card.hero h2 { font-size: clamp(1.5rem, 3.5vw, 2.1rem); }
  .card.hero p { font-size: 1.05rem; }
  .ribbon {
    position: absolute; top: 14px; left: -4px;
    background: var(--sun);
    border: 3px solid var(--ink);
    border-radius: 0 12px 12px 0;
    padding: 5px 12px 5px 14px;
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .topic-pill {
    position: absolute; top: 14px; right: 14px;
    background: var(--topic);
    color: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.8rem;
    font-weight: 800;
    box-shadow: 3px 3px 0 var(--ink);
  }
  /* Without a photo the badges flow in a row above the text instead of overlaying it. */
  .card.no-image .ribbon, .card.no-image .topic-pill {
    position: static;
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
  }
  .badges {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; flex-wrap: wrap;
    padding: 16px 18px 0;
  }
  .badges:empty { display: none; }
  .badges .topic-pill { margin-left: auto; }
  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .card.no-image .card-body { padding-top: 12px; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px 10px;
    font-size: 0.75rem; font-weight: 800; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .meta .new { color: #b45309; }
  .meta .done { color: #15803d; }
  .card h2 {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    margin: 0;
    font-size: 1.3rem;
    line-height: 1.2;
  }
  .card p {
    margin: 0;
    color: var(--sub);
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .empty, .error {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--sub);
    font-weight: 700;
    padding: 40px 20px;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 4px solid var(--ink);
    border-top-color: var(--sun);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 0.78rem;
    font-weight: 700;
    padding: 10px 20px 30px;
  }

  body.reader-open { overflow: hidden; }
  .reader-backdrop {
    position: fixed; inset: 0;
    background: rgba(27, 23, 64, 0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 10;
  }
  .reader-backdrop[hidden] { display: none; }
  .reader {
    position: relative;
    background: var(--card);
    border: 3px solid var(--ink);
    border-radius: 26px;
    width: min(780px, 100%);
    max-height: calc(100vh - 32px);
    display: flex;
    box-shadow: 10px 10px 0 var(--topic);
  }
  .reader-scroll {
    overflow-y: auto;
    padding: 28px 28px 32px;
    width: 100%;
  }
  .reader-close {
    position: absolute; top: 12px; right: 12px;
    width: 44px; height: 44px;
    border: 3px solid var(--ink); border-radius: 50%;
    background: var(--sun); color: var(--ink);
    font-size: 1.2rem; font-weight: 800;
    cursor: pointer; z-index: 1;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .reader .topic-pill { position: static; display: inline-block; margin-right: 8px; }
  .reader .source-tag { font-size: 0.78rem; font-weight: 800; color: var(--sub); text-transform: uppercase; letter-spacing: 0.04em; }
  .reader h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    margin: 12px 44px 6px 0;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    line-height: 1.15;
  }
  .reader .meta { margin-bottom: 4px; }
  .reader-body {
    margin-top: 18px;
    font-size: 1.1rem;
    line-height: 1.7;
  }
  .reader-body p { margin: 0 0 1em; }
  .reader-body h2, .reader-body h3, .reader-body h4 {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    margin: 1.4em 0 0.5em;
    font-size: 1.35rem;
    color: var(--topic);
  }
  .reader-body img {
    max-width: 100%; height: auto;
    border: 3px solid var(--ink);
    border-radius: 18px;
    display: block;
    margin: 0 auto;
  }
  .reader-body figure { margin: 1.2em 0; }
  .reader-body figcaption {
    font-size: 0.82rem; color: var(--sub); font-weight: 700;
    text-align: center; margin-top: 8px;
  }
  .reader-body blockquote {
    margin: 1em 0; padding: 8px 16px;
    border-left: 5px solid var(--topic);
    color: var(--sub);
  }
  .reader-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }

  @media (prefers-reduced-motion: reduce) {
    .card, .chip { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>

<header>
  <h1>📰 Kid <span>News</span></h1>
  <p>Fresh, real stories picked for curious minds 🚀</p>
  <div class="streak" id="streak" hidden></div>
</header>

<div class="controls" id="filters"></div>
<div class="status" id="status"></div>
<main id="main"></main>

<footer>Stories come straight from kid-focused newsrooms and open right here — nothing in this app links out to other websites.</footer>

<div class="reader-backdrop" id="reader" hidden>
  <div class="reader" id="reader-panel" role="dialog" aria-modal="true" aria-labelledby="reader-title">
    <button class="reader-close" id="reader-close" aria-label="Close story">✕</button>
    <div class="reader-scroll">
      <span class="topic-pill" id="reader-topic"></span>
      <span class="source-tag" id="reader-source"></span>
      <h1 id="reader-title"></h1>
      <div class="meta" id="reader-meta"></div>
      <div class="reader-body" id="reader-body"></div>
      <div class="reader-actions">
        <button class="chip" id="reader-done">← Back to stories</button>
        <button class="chip surprise" id="reader-next">🎲 Another one!</button>
      </div>
    </div>
  </div>
</div>

<script>
const PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
const RAW_PROXY = "https://api.allorigins.win/raw?url=";
const MAX_AGE_DAYS = 7;
const STALE_SOURCE_DAYS = 2;

const SOURCES = [
  // TIME for Kids' feed flattens each article into one <p>; the page has the real structure.
  { id: "tfk", name: "TIME for Kids", feed: "https://www.timeforkids.com/feed/", articleSelector: ".article-show__content-article" },
  { id: "sne", name: "Science News Explores", feed: "https://www.snexplores.org/feed" },
  // NASA's feed mixes in APOD mirror pages and Spanish-language press releases.
  { id: "nasa", name: "NASA", feed: "https://www.nasa.gov/feed/", skip: /^APOD:|nota de prensa en inglés|^La NASA\b/i },
];

// First match wins; checked against the title first, then the summary.
const TOPICS = [
  { emoji: "🚀", label: "Space",        color: "#7c3aed", re: /\b(space|nasa|astronauts?|moon|mars|planets?|rockets?|orbit|galaxy|telescopes?|satellites?|solar|artemis|comets?|meteors?|stars?|iss|spacex|crew)\b/i },
  { emoji: "🐾", label: "Animals",      color: "#16a34a", re: /\b(animals?|dogs?|cats?|birds?|fish|whales?|sharks?|bears?|rats?|mole-rats?|insects?|bees?|frogs?|dinosaurs?|wildlife|species|zoo|pets?|elephants?|lions?|penguins?|turtles?|octopus|manatees?|pelicans?)\b/i },
  { emoji: "⚽", label: "Sports",       color: "#ea580c", re: /\b(sports?|soccer|football|nfl|nba|mlb|baseball|basketball|hockey|olympics?|athletes?|teams?|champions?|championship|league|tennis|golf|racing|swimmers?|world cup|super bowl)\b/i },
  { emoji: "🌍", label: "Planet Earth", color: "#2563eb", re: /\b(climate|weather|oceans?|rivers?|floods?|flooding|hurricanes?|volcano(es)?|earthquakes?|forests?|earth|environment|rain|storms?|glaciers?|ice|wildfires?|recycling)\b/i },
  { emoji: "🤖", label: "Tech",         color: "#db2777", re: /\b(robots?|ai|computers?|video games?|gaming|apps?|internet|tech|technology|drones?|electric|inventions?|3d|coding|phones?)\b/i },
  { emoji: "🧠", label: "Body & Brain", color: "#0891b2", re: /\b(brains?|body|health|sleep|food|eating|burps?|farts?|germs?|virus|doctors?|medicine|smell|taste|senses?|memory)\b/i },
  { emoji: "🎨", label: "Arts & Fun",   color: "#ca8a04", re: /\b(movies?|music|art|books?|authors?|films?|games?|pok[eé]mon|festivals?|museums?|history|dance|songs?|lego|comics?|road trip|route 66)\b/i },
];
const DEFAULT_TOPIC = { emoji: "📰", label: "News", color: "#475569" };

function topicFor(item) {
  const title = item.title || "";
  const desc = stripHtml(item.description || "").slice(0, 400);
  return TOPICS.find(t => t.re.test(title)) || TOPICS.find(t => t.re.test(desc)) || DEFAULT_TOPIC;
}

// Extra safety net: drop any item whose title/description hints at adult/violent/scary content,
// in case a feed ever includes something off-brand for a kids audience.
const BLOCK_WORDS = [
  "murder","shooting","stabbing","rape","sexual","suicide","terroris","bomb",
  "war crime","explicit","nude","drug overdose","massacre"
];

function isSafe(item) {
  const text = ((item.title || "") + " " + (item.description || "")).toLowerCase();
  return !BLOCK_WORDS.some(w => text.includes(w));
}

function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").trim();
}

function firstImage(item) {
  if (item.thumbnail) return item.thumbnail;
  if (item.enclosure && item.enclosure.link) return item.enclosure.link;
  const match = /<img[^>]+src="([^"]+)"/.exec(item.description || item.content || "");
  return match ? match[1] : null;
}

function readMinutes(item) {
  const words = stripHtml(item.content || item.description || "").split(/\s+/).length;
  return Math.max(1, Math.round(words / 180));
}

// rss2json emits "YYYY-MM-DD HH:MM:SS" in UTC with no zone marker.
function parseDate(d) {
  if (!d) return new Date(NaN);
  return /[TZ]/.test(d) ? new Date(d) : new Date(d.replace(" ", "T") + "Z");
}

function ageDays(d) {
  return (Date.now() - new Date(d).getTime()) / 86400000;
}

function isFresh(item) {
  const age = ageDays(item.pubDate);
  return !isNaN(age) && age <= MAX_AGE_DAYS;
}

// TIME for Kids republishes one story per grade level.
function dedupe(items) {
  const seen = new Set();
  return items.filter(item => {
    const key = (item.title || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function describeAge(d) {
  const dayOf = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((dayOf(new Date()) - dayOf(new Date(d))) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  return `${days} days ago`;
}

function formatDate(d) {
  try {
    return new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  } catch { return ""; }
}

// Read history is a per-device convenience only.
const READ_KEY = "kidnews.read";
function loadRead() {
  try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch { return new Set(); }
}
const readSet = loadRead();
function markRead(item) {
  readSet.add(item.link);
  try { localStorage.setItem(READ_KEY, JSON.stringify([...readSet].slice(-300))); } catch {}
  const card = document.querySelector(`.card[data-link="${CSS.escape(item.link)}"]`);
  if (card && !card.classList.contains("read")) {
    card.classList.add("read");
    const done = document.createElement("span");
    done.className = "done";
    done.textContent = "✓ Read";
    card.querySelector(".meta").appendChild(done);
  }
  updateStreak();
}
function updateStreak() {
  const el = document.getElementById("streak");
  const n = readSet.size;
  el.hidden = n === 0;
  el.textContent = n === 1 ? "📚 1 story read — nice start!" : `📚 ${n} stories read${n >= 10 ? " — you're on fire! 🔥" : ""}`;
}

function renderFilters(active) {
  const el = document.getElementById("filters");
  el.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (active === "all" ? " active" : "");
  all.textContent = "All stories";
  all.onclick = () => loadAll("all");
  el.appendChild(all);

  SOURCES.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "chip" + (active === s.id ? " active" : "");
    btn.textContent = s.name;
    btn.onclick = () => loadAll(s.id);
    el.appendChild(btn);
  });

  const surprise = document.createElement("button");
  surprise.className = "chip surprise";
  surprise.textContent = "🎲 Surprise me!";
  surprise.onclick = openRandom;
  el.appendChild(surprise);
}

function openRandom(exclude) {
  const pool = currentItems.filter(i => i !== exclude);
  if (!pool.length) return;
  const unread = pool.filter(i => !readSet.has(i.link));
  const pick = (unread.length ? unread : pool)[Math.floor(Math.random() * (unread.length ? unread : pool).length)];
  openReader(pick);
}

// Everything a kid sees is rebuilt from a whitelist. Links are unwrapped to
// plain text so there is no way to navigate off the page.
const ALLOWED_TAGS = new Set(["P","BR","H2","H3","H4","UL","OL","LI","STRONG","B","EM","I","BLOCKQUOTE","FIGURE","FIGCAPTION","IMG"]);
const DROP_SELECTOR = "script,style,iframe,svg,nav,aside,form,button,input,[class*='navigation'],[class*='related'],[class*='share'],[class*='social'],[class*='embed'],[class*='instagram'],[class*='tiktok'],[class*='twitter'],[class*='youtube']";

function sanitize(html) {
  const doc = new DOMParser().parseFromString(html || "", "text/html");
  doc.querySelectorAll(DROP_SELECTOR).forEach(el => el.remove());
  const out = document.createDocumentFragment();
  const walk = (src, dst) => {
    src.childNodes.forEach(n => {
      if (n.nodeType === Node.TEXT_NODE) { dst.appendChild(document.createTextNode(n.textContent)); return; }
      if (n.nodeType !== Node.ELEMENT_NODE) return;
      if (!ALLOWED_TAGS.has(n.tagName)) { walk(n, dst); return; }
      const el = document.createElement(n.tagName.toLowerCase());
      if (n.tagName === "IMG") {
        const src = n.getAttribute("src") || "";
        if (!/^https:\/\//i.test(src)) return;
        el.src = src;
        el.alt = n.getAttribute("alt") || "";
        el.loading = "lazy";
      }
      walk(n, el);
      if (el.tagName === "P" && !el.textContent.trim() && !el.querySelector("img")) return;
      dst.appendChild(el);
    });
  };
  walk(doc.body, out);
  return out;
}

function articleHtml(item) {
  let html = item.content || item.description || "";
  const title = (item.title || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  // TIME for Kids repeats the headline as the first line of the body.
  html = html.replace(new RegExp("^\\s*<p>\\s*" + title + "\\s*(<br\\s*/?>)?", "i"), "<p>");
  return html;
}

let currentItems = [];
let currentItem = null;
const articleCache = new Map();
let readerToken = 0;

async function fetchStructuredArticle(item) {
  if (!item.articleSelector) return null;
  if (articleCache.has(item.link)) return articleCache.get(item.link);
  // The proxy echoes the requesting origin in its CORS header and its CDN caches the response,
  // so key the cache by our hostname or another origin's cached copy gets rejected here.
  const res = await fetch(RAW_PROXY + encodeURIComponent(item.link) + "&origin=" + encodeURIComponent(location.hostname));
  if (!res.ok) throw new Error("article fetch failed");
  const doc = new DOMParser().parseFromString(await res.text(), "text/html");
  const node = doc.querySelector(item.articleSelector);
  const html = node && node.querySelectorAll("p").length > 1 ? node.innerHTML : null;
  articleCache.set(item.link, html);
  return html;
}

function renderReaderBody(item, html) {
  const body = document.getElementById("reader-body");
  body.innerHTML = "";
  const content = sanitize(html);
  const hero = firstImage(item);
  if (hero && !content.querySelector("img")) {
    const img = document.createElement("img");
    img.src = hero; img.alt = "";
    body.appendChild(img);
  }
  body.appendChild(content);
}

function openReader(item) {
  const token = ++readerToken;
  currentItem = item;
  const topic = topicFor(item);
  renderReaderBody(item, articleHtml(item));
  fetchStructuredArticle(item)
    .then(html => { if (html && token === readerToken) renderReaderBody(item, html); })
    .catch(() => {});

  document.getElementById("reader-panel").style.setProperty("--topic", topic.color);
  document.getElementById("reader-topic").textContent = `${topic.emoji} ${topic.label}`;
  document.getElementById("reader-source").textContent = item.sourceName;
  document.getElementById("reader-title").textContent = item.title;
  document.getElementById("reader-meta").textContent = `${formatDate(item.pubDate)} · ${describeAge(item.pubDate)} · ${readMinutes(item)} min read`;

  const reader = document.getElementById("reader");
  reader.hidden = false;
  reader.querySelector(".reader-scroll").scrollTop = 0;
  document.body.classList.add("reader-open");
  document.getElementById("reader-close").focus();
  markRead(item);
}

function closeReader() {
  document.getElementById("reader").hidden = true;
  document.body.classList.remove("reader-open");
}

document.getElementById("reader-close").onclick = closeReader;
document.getElementById("reader-done").onclick = closeReader;
document.getElementById("reader-next").onclick = () => openRandom(currentItem);
document.getElementById("reader").addEventListener("click", e => { if (e.target.id === "reader") closeReader(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

function renderStories(items) {
  currentItems = items;
  const main = document.getElementById("main");
  main.innerHTML = "";
  if (!items.length) {
    main.innerHTML = '<div class="empty">No stories to show right now. Try again in a bit!</div>';
    return;
  }
  items.forEach((item, index) => {
    const topic = topicFor(item);
    const isHero = index === 0 && items.length > 2;
    const isNew = describeAge(item.pubDate) === "today";
    const isRead = readSet.has(item.link);

    const card = document.createElement("article");
    const img = firstImage(item);
    card.className = "card" + (isHero ? " hero" : "") + (isRead ? " read" : "") + (img ? "" : " no-image");
    card.style.setProperty("--topic", topic.color);
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.dataset.index = index;
    card.dataset.link = item.link;

    let desc = stripHtml(item.description);
    if (desc.toLowerCase().startsWith((item.title || "").toLowerCase())) {
      desc = desc.slice(item.title.length).trim();
    }
    const maxLen = isHero ? 240 : 150;
    desc = desc.slice(0, maxLen);

    const badges = `${isHero ? `<span class="ribbon">⭐ TOP STORY</span>` : ""}<span class="topic-pill"></span>`;
    card.innerHTML = `
      ${img ? `<img src="${img}" alt="" loading="lazy">${badges}` : `<div class="badges">${badges}</div>`}
      <div class="card-body">
        <div class="meta">
          <span class="src"></span>
          <span>${formatDate(item.pubDate)} · ${describeAge(item.pubDate)}</span>
          <span>${readMinutes(item)} min read</span>
          ${isNew ? `<span class="new">✨ New</span>` : ""}
          ${isRead ? `<span class="done">✓ Read</span>` : ""}
        </div>
        <h2></h2>
        <p></p>
      </div>
    `;
    card.querySelector(".topic-pill").textContent = `${topic.emoji} ${topic.label}`;
    card.querySelector(".src").textContent = item.sourceName;
    card.querySelector("h2").textContent = item.title;
    card.querySelector("p").textContent = desc + (desc.length === maxLen ? "…" : "");
    const open = () => openReader(currentItems[card.dataset.index]);
    card.onclick = open;
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
    main.appendChild(card);
  });
}

let currentFilter = "all";

async function fetchSource(source) {
  const res = await fetch(PROXY + encodeURIComponent(source.feed));
  const data = await res.json();
  if (data.status !== "ok") throw new Error(source.name + " feed failed");
  return data.items
    .filter(isSafe)
    .filter(item => !(source.skip && source.skip.test((item.title || "") + "\n" + stripHtml(item.description || "").slice(0, 200))))
    .map(item => ({ ...item, pubDate: parseDate(item.pubDate), sourceId: source.id, sourceName: source.name, articleSelector: source.articleSelector }));
}

async function loadAll(filter) {
  currentFilter = filter || currentFilter;
  renderFilters(currentFilter);

  const status = document.getElementById("status");
  const main = document.getElementById("main");
  status.textContent = "Loading stories…";
  main.innerHTML = '<div class="empty"><div class="spinner"></div>Fetching the news…</div>';

  const toFetch = currentFilter === "all" ? SOURCES : SOURCES.filter(s => s.id === currentFilter);

  try {
    const results = await Promise.allSettled(toFetch.map(fetchSource));
    let items = [];
    let failures = [];
    let staleSources = [];
    results.forEach((r, i) => {
      if (r.status !== "fulfilled") { failures.push(toFetch[i].name); return; }
      const fresh = r.value.filter(isFresh);
      const newest = fresh.reduce((m, it) => Math.max(m, new Date(it.pubDate).getTime()), 0);
      if (!fresh.length || ageDays(newest) > STALE_SOURCE_DAYS) {
        staleSources.push(`${toFetch[i].name} (latest ${newest ? describeAge(newest) : "older than a week"})`);
      }
      items = items.concat(fresh);
    });

    // Keep the longest variant of each story (TIME for Kids' higher-grade editions carry the full text).
    items.sort((a, b) => (b.content || "").length - (a.content || "").length);
    items = dedupe(items);
    items.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    renderStories(items);
    const notes = [];
    if (failures.length) notes.push(`Couldn't load: ${failures.join(", ")}.`);
    if (staleSources.length) notes.push(`May be outdated: ${staleSources.join(", ")}.`);
    status.textContent = notes.length
      ? notes.join(" ")
      : `${items.length} stories from the last ${MAX_AGE_DAYS} days · updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    main.innerHTML = `<div class="error">Something went wrong loading the news. Please try again.</div>`;
    status.textContent = "";
  }
}

updateStreak();
renderFilters(currentFilter);
loadAll(currentFilter);
</script>
